[project]
name = "milvus"
version = "0.1.0"
description = "Milvus Vector Database"
authors = [
    {name = "Vuk Glisovic"}
]
requires-python = "==3.13.*"

# PyPI dependencies
dependencies = [
    "pymilvus==2.6.0",
    "datasets>=4.0.0,<5",
    "numpy>=2.3.2,<3", 
    "tqdm>=4.67.1,<5"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Conda dependencies
[tool.pixi.dependencies]
ipykernel = ">=6.30.1,<7"

[tool.pixi.tasks]
load_glove = { cmd = "python load_glove_100_angular.py", cwd = "scripts" }
benchmark = { cmd = "python benchmark_index_configs.py", cwd = "scripts" }
