[project]
name = "hdr_image_creation"
version = "0.1.0"
description = "Tools that edit and combine images"
authors = [
    {name = "Vuk Glisovic"}
]
requires-python = "==3.12.*"

# PyPI dependencies
dependencies = [
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "Pillow==12.3.0",
    "rawpy==0.27.1", 
    "fastapi>=0.162.0,<0.163", 
    "uvicorn>=0.54.0,<0.55", 
    "python-multipart>=0.0.33,<0.0.34",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
combine-aeb-images = { cmd = "python combine-aeb-images.py", cwd = "scripts" }
app = { cmd = "uvicorn app:app --host 0.0.0.0 --port 8501", cwd = "scripts" }
